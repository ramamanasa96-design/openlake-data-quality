[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "openlake-data-quality"
version = "0.1.0"
description = "A lightweight open-source data quality validator and profiler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Manasa Rama" },
]

dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]


[project.scripts]
openlake = "openlake.cli:main"


[tool.setuptools.packages.find]
include = [
    "openlake*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]


[tool.ruff]
line-length = 88
target-version = "py310"